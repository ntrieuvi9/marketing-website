backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  # 1. Quản trị các Dịch Vụ
  - name: "services"
    label: "Dịch Vụ"
    folder: "services"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Tên dịch vụ", name: "title", widget: "string"}
      - {label: "Icon Emoji", name: "icon", widget: "string", default: "📈"}
      - {label: "Mô tả ngắn", name: "description", widget: "string"}
      - {label: "Nội dung chi tiết dịch vụ", name: "body", widget: "markdown"}

  # 2. Quản trị Bài Viết & Case Study
  - name: "blog"
    label: "Bài Viết"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Tiêu đề", name: "title", widget: "string"}
      - {label: "Ngày đăng", name: "date", widget: "datetime"}
      - {label: "Hình thu nhỏ", name: "thumbnail", widget: "image", required: false}
      - {label: "Nội dung bài viết", name: "body", widget: "markdown"}